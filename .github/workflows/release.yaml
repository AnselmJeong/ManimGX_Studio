# Preserved upstream engine workflow; Studio uses its documented local checks.
# A release: pushing the tag vX.Y.Z (`just release`) builds, tests and publishes ManimGX X.Y.Z.
# Every artifact is built and tested before publication. GitHub receives the wheels, source
# distributions, complete source, executables and npm tarball first, so the advertised source
# is public before binaries reach any registry. PyPI receives the fonts before ManimGX; npm
# follows PyPI because the browser installs its matching Python release. GHCR receives the
# tested OCI images, with their SBOMs and provenance. Publishing transfers existing artifacts;
# it never rebuilds them. Registry uploads can be retried, and all must succeed to complete.
# GitHub locks release assets and tags only when repository release immutability is enabled;
# this workflow does not change that setting. Pull requests and manual runs publish nothing.

name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yaml
      - .github/workflows/create-wheels.yaml
      - .github/workflows/create-executables.yaml
      - .github/workflows/publish-npm.yaml
      - scripts/release/**
      - pyproject.toml
      - fonts/*/pyproject.toml
      - browser/**
      - docker/**
      - uv.lock
      - rust/Cargo.toml
      - rust/*/Cargo.toml
      - rust/*/build.rs
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # what a release publishes is built from nothing cached
  ACTIONS_CACHE_MODE: none

jobs:
  version:
    if: ${{ github.repository == 'academa-labs/manimgx' }}
    name: Check the version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: just

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # a tag is ManimGX's version, and the changelog says what it changes
      - name: Check the version
        id: version
        run: |
          version="$(uv version --short --package manimgx)"
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
              echo "::error::The tag is ${GITHUB_REF_NAME}, but ManimGX's version is ${version}"
              exit 1
            fi
            if [[ -z "$(just release-notes "${version}" | tr -d '[:space:]')" ]]; then
              echo "::error::docs/content/changelog.md has no section for ${version}"
              exit 1
            fi
          fi
          prerelease=false
          if [[ "${version}" =~ (a|b|rc)[0-9]+$ ]]; then prerelease=true; fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

  test:
    name: Test
    if: ${{ github.repository == 'academa-labs/manimgx' && (github.ref_type == 'tag') }}
    uses: $/.github/workflows/test.yaml
    permissions:
      contents: read
      statuses: write

  wheels:
    if: ${{ github.repository == 'academa-labs/manimgx' }}
    name: Wheels
    uses: $/.github/workflows/create-wheels.yaml
    permissions:
      contents: read

  sdist:
    if: ${{ github.repository == 'academa-labs/manimgx' }}
    name: Source distributions
    needs: [wheels, executables]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: just

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sources-*
          path: release-sources
          merge-multiple: true

      # Native archives and Cargo sources, plus the exact distribution source packages
      # retained by the Linux jobs which linked and repaired the wheels.
      - name: Build the source distribution and the complete source
        run: just build-source

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/manimgx-*.tar.gz
          if-no-files-found: error

      # for the GitHub release, beside the wheels, not for PyPI
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source
          path: dist/manimgx-*-source.tar.xz
          if-no-files-found: error

      # the font packages: their wheels and source distributions, for PyPI alone
      - name: Build the font packages
        run: just build-fonts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manimgx-fonts
          path: dist/manimgx_fonts-*
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manimgx-fonts-cjk
          path: dist/manimgx_fonts_cjk-*
          if-no-files-found: error

  executables:
    if: ${{ github.repository == 'academa-labs/manimgx' }}
    name: Executables
    needs: wheels
    uses: $/.github/workflows/create-executables.yaml
    permissions:
      contents: read

  npm-build:
    if: ${{ github.repository == 'academa-labs/manimgx' }}
    name: Build the npm artifact
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: just
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build, test and pack the browser package
        run: |
          just build-npm
          just test-typescript
          mkdir -p "$RUNNER_TEMP/npm"
          npm pack ./browser --pack-destination "$RUNNER_TEMP/npm"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm
          path: ${{ runner.temp }}/npm/*.tgz
          if-no-files-found: error

  docker-build:
    if: ${{ github.repository == 'academa-labs/manimgx' }}
    name: Build and test the ${{ matrix.arch }} image
    needs: [version, wheels, sdist]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, wheel: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64, wheel: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{release-wheel-linux-${{ matrix.wheel }},manimgx-fonts,manimgx-fonts-cjk}"
          path: docker/wheels
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Lock the image's runtime dependencies
        run: >-
          uv export --frozen --package manimgx --no-default-groups --no-emit-workspace
          --no-header --no-annotate > docker/wheels/requirements.txt
      - name: Build the OCI artifact with provenance and an SBOM
        run: |
          docker buildx build --target release --platform "linux/$ARCH" \
            --tag "ghcr.io/$GITHUB_REPOSITORY:$VERSION" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label 'org.opencontainers.image.licenses=MIT AND GPL-3.0-or-later' \
            --provenance=mode=max --sbom=true \
            --output "type=oci,dest=$RUNNER_TEMP/image-$ARCH.tar" docker
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.version.outputs.version }}
      - name: Test the actual image without network access
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
          skopeo copy "oci-archive:$RUNNER_TEMP/image-$ARCH.tar" docker-daemon:manimgx:smoke
          docker run --rm --network none --entrypoint python \
            -v "$PWD/scripts/release/smoke_test.py:/smoke_test.py:ro" \
            manimgx:smoke /smoke_test.py
        env:
          ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-${{ matrix.arch }}.tar
          if-no-files-found: error

  draft-release:
    name: Draft the GitHub release
    needs: [version, test, wheels, sdist, executables, npm-build, docker-build]
    if: ${{ github.repository == 'academa-labs/manimgx' && (github.ref_type == 'tag') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the release
      id-token: write # the attestations' signatures
      attestations: write
      artifact-metadata: write
    steps:
      # for the changelog
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: just

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{release-wheel-*,sdist,source,executable-*,npm}"
          path: assets
          merge-multiple: true

      # each file's provenance, signed: the workflow, commit and run that built it
      # (`gh attestation verify FILE --repo academa-labs/manimgx`)
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: assets/*

      # its notes: the changelog's section, then where the wheels' complete source is, which
      # x264's and FFmpeg's licenses ask for beside the wheels (FFmpeg's, in its own words)
      - name: Draft the release
        run: |
          source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/manimgx-${VERSION}-source.tar.xz"
          {
            just release-notes "${VERSION}"
            printf '\n---\n\n'
            echo "The wheels and executables hold FFmpeg, under the LGPL, and all but the" \
              "browser's wheel hold x264, under the GPL, which makes them, as a whole," \
              "GPL-3.0-or-later. Their complete source and build recipes are" \
              "[manimgx-${VERSION}-source.tar.xz](${source}): the source of ManimGX, of every" \
              "crate, and of each library the engine is built from. This software uses code of" \
              "[FFmpeg](https://ffmpeg.org) licensed under the LGPLv2.1 and its source can be" \
              "downloaded [here](${source})."
          } > "${RUNNER_TEMP}/notes.md"
          flags=()
          if [[ "${PRERELEASE}" == true ]]; then flags+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" assets/* --draft --verify-tag \
            --title "ManimGX ${VERSION}" --notes-file "${RUNNER_TEMP}/notes.md" "${flags[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}

  github-release:
    if: ${{ github.repository == 'academa-labs/manimgx' }}
    name: Publish the artifacts and their source
    needs: draft-release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Make the complete source available before registry uploads
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --repo "${GITHUB_REPOSITORY}"
        env:
          GH_TOKEN: ${{ github.token }}

  pypi-fonts:
    if: ${{ github.repository == 'academa-labs/manimgx' }}
    name: Publish ${{ matrix.package }} to PyPI
    needs: github-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: manimgx-fonts, environment: pypi-fonts }
          - { package: manimgx-fonts-cjk, environment: pypi-fonts-cjk }
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # A pending PyPI publisher identifies one project by its workflow and environment.
    # Each font package gets its own identity and only its own distributions.
    environment:
      name: ${{ matrix.environment }}
      url: https://pypi.org/project/${{ matrix.package }}/
    permissions:
      id-token: write # trusted publishing, and the attestations' signatures
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.package }}
          path: dist

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6

      # The fonts change rarely: skip files PyPI already has.
      - name: Publish to PyPI
        run: uv publish --check-url https://pypi.org/simple/

  pypi:
    if: ${{ github.repository == 'academa-labs/manimgx' }}
    name: Publish ManimGX to PyPI
    # Publish the required fonts first, so ManimGX is installable as soon as it appears.
    needs: [version, github-release, pypi-fonts]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/manimgx/${{ needs.version.outputs.version }}/
    permissions:
      id-token: write # trusted publishing, and the attestations' signatures
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{release-wheel-*,sdist}"
          path: dist
          merge-multiple: true

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # each file's PEP 740 attestation, which `uv publish` uploads beside it
      - uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6

      # A retry skips files already uploaded by an earlier attempt.
      - name: Publish to PyPI
        run: uv publish --check-url https://pypi.org/simple/

  docker:
    if: ${{ github.repository == 'academa-labs/manimgx' }}
    name: Publish the tested Docker images
    needs: [version, github-release, docker-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: docker-*
          path: images
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Transfer exact images and assemble their platform index
        id: publish
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
          image="ghcr.io/$GITHUB_REPOSITORY"
          for arch in amd64 arm64; do
            skopeo copy --all --preserve-digests --authfile "$HOME/.docker/config.json" \
              "oci-archive:images/image-$arch.tar" "docker://$image:$VERSION-$arch"
          done
          tags=(--tag "$image:$VERSION")
          if [[ "$PRERELEASE" == false ]]; then tags+=(--tag "$image:${VERSION%.*}"); fi
          docker buildx imagetools create "${tags[@]}" "$image:$VERSION-amd64" "$image:$VERSION-arm64"
          skopeo inspect --raw "docker://$image:$VERSION" > index.json
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' index.json
          echo "digest=sha256:$(sha256sum index.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  npm:
    if: ${{ github.repository == 'academa-labs/manimgx' }}
    name: Publish to npm
    # after PyPI: the package installs this release of ManimGX from there
    needs: [pypi]
    uses: $/.github/workflows/publish-npm.yaml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: read
      attestations: read
      id-token: write # trusted publishing, and the provenance's signature

  publish:
    if: ${{ github.repository == 'academa-labs/manimgx' }}
    name: Verify release completion
    needs: [pypi, npm, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Confirm the public release after every registry succeeded
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isDraft,url \
            --jq 'if .isDraft then error("release is still a draft") else .url end' >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
