# Preserved upstream engine workflow; Studio uses its documented local checks.
# Frozen authoring and candidate wheels use the same host through the ordinary corpus runner.
# This experiment changes no canonical movies, case facts, reviews or published assets.
name: Frozen renderer experiment

on:
  workflow_dispatch:
    inputs:
      baseline_run:
        description: Test run containing the reviewed wheel artifacts
        required: true
        type: string
      candidate_run:
        description: Test run containing candidate wheels (empty uses baseline)
        required: false
        type: string
      shader_run:
        description: Optional Test run with an actual shader mutant of the baseline
        required: false
        type: string
      platforms:
        description: JSON list of hosted runners to compare
        required: true
        default: '["ubuntu-24.04", "macos-26", "windows-2025"]'
        type: string
      cases:
        description: Space-separated case names (empty compares the entire corpus)
        required: false
        type: string

permissions: {}

jobs:
  compare:
    if: ${{ github.repository == 'academa-labs/manimgx' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms) }}
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    env:
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"

      - name: Install the Linux GPU driver
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libvulkan1 mesa-vulkan-drivers

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-${{ matrix.os }}
          path: baseline
          run-id: ${{ inputs.baseline_run }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-${{ matrix.os }}
          path: candidate
          run-id: ${{ inputs.candidate_run || inputs.baseline_run }}
          github-token: ${{ github.token }}

      - name: Retrieve the reference dependency lock
        run: |
          commit="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASELINE_RUN}" --jq .head_sha)"
          gh api "repos/${GITHUB_REPOSITORY}/contents/uv.lock?ref=${commit}" \
            --header 'Accept: application/vnd.github.raw+json' > baseline/uv.lock
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN: ${{ inputs.baseline_run }}

      - name: Install the candidate artifact and test dependencies
        run: |
          uv sync --frozen --no-install-project
          uv pip install --no-deps candidate/*.whl

      - name: Prove source differences are detected
        run: |
          wheel=(baseline/*.whl)
          sha="$(uv run --frozen --no-sync python -c 'import hashlib,sys; print(hashlib.file_digest(open(sys.argv[1], "rb"), "sha256").hexdigest())' "${wheel[0]}")"
          uv run --frozen --no-sync python -m tests.integration.corpus.frozen_probe \
            negative-source basic_usage --negative-source \
            --wheel "${wheel[0]}" --sha256 "${sha}" --lock baseline/uv.lock

      - name: Compare every scene on the same adapter
        run: |
          wheel=(baseline/*.whl)
          read -r -a cases <<< "$CASE_NAMES"
          sha="$(uv run --frozen --no-sync python -c 'import hashlib,sys; print(hashlib.file_digest(open(sys.argv[1], "rb"), "sha256").hexdigest())' "${wheel[0]}")"
          uv run --frozen --no-sync python -m tests.integration.corpus.frozen_probe \
            frozen-comparison "${cases[@]}" --wheel "${wheel[0]}" --sha256 "${sha}" --lock baseline/uv.lock
        env:
          CASE_NAMES: ${{ inputs.cases }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ !cancelled() && inputs.shader_run != '' }}
        with:
          name: wheel-${{ matrix.os }}
          path: shader-mutant
          run-id: ${{ inputs.shader_run }}
          github-token: ${{ github.token }}

      - name: Prove the actual shader mutation is detected
        if: ${{ !cancelled() && inputs.shader_run != '' }}
        run: |
          uv pip install --force-reinstall --no-deps shader-mutant/*.whl
          wheel=(baseline/*.whl)
          sha="$(uv run --frozen --no-sync python -c 'import hashlib,sys; print(hashlib.file_digest(open(sys.argv[1], "rb"), "sha256").hexdigest())' "${wheel[0]}")"
          uv run --frozen --no-sync python -m tests.integration.corpus.frozen_probe \
            negative-shader three_d_light_source_position --expect-different \
            --wheel "${wheel[0]}" --sha256 "${sha}" --lock baseline/uv.lock
          uv run --frozen --no-sync python -m tests.integration.corpus.frozen_probe \
            shader-unaffected basic_usage \
            --wheel "${wheel[0]}" --sha256 "${sha}" --lock baseline/uv.lock

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: frozen-comparison-${{ matrix.os }}
          path: |
            frozen-comparison/
            !frozen-comparison/reference-wheel/**
            negative-source/
            !negative-source/reference-wheel/**
            negative-shader/
            !negative-shader/reference-wheel/**
            shader-unaffected/
            !shader-unaffected/reference-wheel/**
          if-no-files-found: error
          retention-days: 7
