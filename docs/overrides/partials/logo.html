{#-
  The logo, ManimGX (scripts/showcase/logo.py draws it): one for each scheme, the stylesheet
  showing the page's. It is the site's name, so the header doesn't write the name beside it.
-#}
<img class="mx-logo mx-logo--light" src="{{ 'images/logo-light.svg' | url }}" alt="{{ config.site_name }}">
<img class="mx-logo mx-logo--dark" src="{{ 'images/logo-dark.svg' | url }}" alt="{{ config.site_name }}">
