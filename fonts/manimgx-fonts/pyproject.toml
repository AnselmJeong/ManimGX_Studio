# The Noto fonts ManimGX sets text in, besides Typst's own: a package of their own, released only
# when they change, which ManimGX requires at an exact version (pyproject.toml).
# The version is the date the fonts were taken from Noto.
[project]
name = "manimgx-fonts"
version = "2026.9.26.post1"
description = "The Noto fonts ManimGX sets text in: Noto Sans, Noto Emoji, Noto Sans Symbols, and Noto Sans for the scripts Latin faces lack."
readme = "README.md"
license = "OFL-1.1"
license-files = ["LICENSE"]
authors = [{ name = "Academa Team", email = "team@academa.ai" }]
classifiers = ["Topic :: Text Processing :: Fonts"]

[project.urls]
Documentation = "https://manimgx.academa.ai/"
Repository = "https://github.com/academa-labs/manimgx"

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"
