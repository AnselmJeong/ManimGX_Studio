# Whose each file is, and under which license (REUSE, https://reuse.software), where the file
# doesn't say so itself: its own SPDX lines come first, then the last annotation here that
# matches it. LICENSES/ holds the licenses' texts; `reuse lint` (just check) checks that every
# file is covered. The license texts the crates keep for the sources they fetch (COPYING*,
# LICENSE) are their projects', and REUSE leaves them be.
version = 1

# ManimGX's own: everything the file or a later annotation doesn't claim
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Academa, Inc."
SPDX-License-Identifier = "MIT"

# The desktop application added for this repository
[[annotations]]
path = "desktop/**"
SPDX-FileCopyrightText = "2026 AnselmJeong"
SPDX-License-Identifier = "MIT"

# the corpus: its scenes are mostly Manim CE's documentation's, and ce.mkv their renders by CE
[[annotations]]
path = "tests/integration/cases/**"
SPDX-FileCopyrightText = ["2026 Academa, Inc.", "2024 the Manim Community Developers"]
SPDX-License-Identifier = "MIT"

# the United States' outline, from us-atlas 3.0.1 (https://github.com/topojson/us-atlas), and its
# license
[[annotations]]
path = "tests/integration/cases/labeled_country_example/nation-10m.json*"
SPDX-FileCopyrightText = "2013-2019 Michael Bostock"
SPDX-License-Identifier = "ISC"

# the Noto fonts, unmodified
[[annotations]]
path = "fonts/manimgx-fonts/src/manimgx_fonts/NotoSans*.ttf"
SPDX-FileCopyrightText = "2022-2025 The Noto Project Authors (https://github.com/notofonts)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "fonts/manimgx-fonts/src/manimgx_fonts/NotoEmoji*.ttf"
SPDX-FileCopyrightText = "2013 Google LLC"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "fonts/manimgx-fonts-cjk/src/manimgx_fonts_cjk/*.ttc"
SPDX-FileCopyrightText = "2014-2021 Adobe (http://www.adobe.com/), with Reserved Font Name 'Source'"
SPDX-License-Identifier = "OFL-1.1"

# the command spec made from mitex's Typst package (the crate's LICENSE is mitex's)
[[annotations]]
path = "rust/mitex-spec-gen/spec.rkyv"
SPDX-FileCopyrightText = "the mitex authors (Myriad-Dreamin, OrangeX4, Enter-tainer, Shichien)"
SPDX-License-Identifier = "Apache-2.0"

# the DFG table scripts/engine/dfg_table.py writes: whose that script is
[[annotations]]
path = "rust/engine/src/dfg.bin"
SPDX-FileCopyrightText = ["2026 Academa, Inc.", "2015 The Android Open Source Project"]
SPDX-License-Identifier = "Apache-2.0"

# documents from elsewhere: the Contributor Covenant, adapted
[[annotations]]
path = ".github/CODE_OF_CONDUCT.md"
SPDX-FileCopyrightText = ["Organization for Ethical Source", "2026 Academa, Inc."]
SPDX-License-Identifier = "CC-BY-SA-4.0"
